$schema: '../../.moon/cache/schemas/project.json'
id: web
language: typescript
tags: [sdk]

dependsOn: [twip-wasm]

tasks:
  # tsc to dist/ (ESM and .d.ts), plus the engine module copied beside it.
  build:
    command: node build.mjs
    deps: [twip-wasm:build]
    inputs: ['build.mjs', 'tsconfig.json', 'src/**/*']
    outputs: ['dist']
  # The unit tests (the wire fixtures round trip, commands, events, services, fonts), the contract scripts, the Node
  # smoke through the package's export, the tests' types (with every wire fixture checked against its public type,
  # test/wire-types.ts) and the API report (api/twip-web.api.md; `pnpm exec api-extractor run --local` updates it
  # after an intended change).
  test:
    script: node --test "test/*.test.ts" && node test/wire-types.ts && pnpm exec tsc --noEmit -p test && pnpm exec api-extractor run
    deps: [build]
    inputs: ['test/**/*', 'api-extractor.json', 'api/**/*', '/crates/twip/tests/wire/**/*', '/tests/contract/**/*', '/crates/twip/tests/fixtures/**/*']
  contract:
    command: node --test test/contract.test.ts
    deps: [build]
    inputs: ['test/contract.test.ts', '/tests/contract/**/*', '/crates/twip/tests/fixtures/**/*']
    # Part of test; for running the contract runners alone.
    options:
      runInCI: false
  # A mounted editor in a real browser (the installed Edge; PW_CHANNEL=chromium in CI).
  # Everything but the latency budgets (latency below).
  browser-test:
    command: pnpm exec playwright test --grep-invert "within a refresh"
    deps: [build]
    inputs: ['browser/**/*', 'playwright.config.mjs']
    options:
      cache: false
  # The latency budgets (browser/latency.spec.ts) hold on a quiet machine with a GPU, not beside other tasks: run alone.
  latency:
    command: pnpm exec playwright test browser/latency.spec.ts
    deps: [build]
    inputs: ['browser/**/*', 'playwright.config.mjs']
    options:
      cache: false
      runInCI: false
