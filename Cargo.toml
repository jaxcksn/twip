[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jaxcksn/twip"
rust-version = "1.88"

# Line tables keep backtraces and profiles readable; full debug info made an incremental `cargo test -p twip`
# rebuild 22 s instead of 18.5 s (Windows, 2026-10-29), mostly in linking. Debuggers lose local variables.
[profile.dev]
debug = "line-tables-only"

# Skia compiles at the same level in both profiles, so one prebuilt Skia archive serves debug and release.
[profile.dev.package.skia-bindings]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# The C API's library overrides this to unwind (crates/twip-capi/build-native.mjs), so its entry points catch panics.
panic = "abort"

# twip-graphics' pixel kernels need the optimiser's full inlining: at "s" its benchmarks ran 3 to 5 times slower (a
# text frame 3.08 ms against 0.80 ms), for 21 KB more gzipped wasm at 3 (373 KB against 394 KB, the renderer alone;
# Windows, 2026-11-11). `bench` inherits this.
[profile.release.package.twip-graphics]
opt-level = 3

# Benchmarks keep release's opt-level but skip its whole-program LTO and single codegen unit, which make every
# `cargo bench` rebuild take minutes; compare benchmark numbers with each other, not with the shipped library's.
# Line tables let a sampling profiler attribute benchmark time to source lines (CONTRIBUTING.md, Profiling).
[profile.bench]
debug = "line-tables-only"
lto = false
codegen-units = 16
incremental = true
