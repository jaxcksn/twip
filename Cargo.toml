[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jaxcksn/twip"
rust-version = "1.88"

# Skia compiles at the same level in both profiles, so one prebuilt Skia archive serves debug and release.
[profile.dev.package.skia-bindings]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
