$schema: '../../.moon/cache/schemas/project.json'
language: rust
tags: [engine]

# Native cargo runs through build-native.mjs, as the native library builds.
tasks:
  # The tests and the lint build it too.
  build:
    command: node ../twip-capi/build-native.mjs build -p twip
    inputs: ['src/**/*', 'build.rs', 'Cargo.toml', '/crates/twip-capi/build-native.mjs']
    options:
      runInCI: false
  # The unit tests and the rust contract runner (tests/contract.rs) under nextest, then the doctests, which it can't run.
  test:
    script: node ../twip-capi/build-native.mjs nextest run -p twip && node ../twip-capi/build-native.mjs test -p twip --doc
    inputs: ['src/**/*', 'build.rs', 'tests/**/*', 'examples/**/*', 'Cargo.toml', '/crates/twip-document/src/**/*', '/crates/twip-document/Cargo.toml', '/tests/contract/**/*', '/crates/twip-capi/build-native.mjs', '/crates/twip-graphics/tests/fonts/**/*']
  # The round-trip gate's saved packages against the OOXML schemas (tests/fidelity/validate, the Open XML SDK).
  fidelity-schema:
    script: node ../twip-capi/build-native.mjs nextest run -p twip --lib tests::fidelity && dotnet run --project tests/fidelity/validate -c Release -- ../../target/fidelity
    env:
      TWIP_FIDELITY_OUT: '../../target/fidelity'
    inputs: ['src/**/*', 'tests/fidelity/**/*', '!tests/fidelity/validate/bin/**', '!tests/fidelity/validate/obj/**', 'Cargo.toml', '/crates/twip-capi/build-native.mjs']
  # Every comparison of a model type that holds formatting, against the relations tests/equality/sites.txt names.
  equality-audit:
    command: python3 -I tests/equality/audit.py
    inputs: ['src/**/*', 'tests/equality/**/*', 'Cargo.toml', '/Cargo.lock', '/crates/twip-document/src/**/*']
  example:
    command: node ../twip-capi/build-native.mjs run -p twip --example session
    inputs: ['src/**/*', 'examples/**/*', 'Cargo.toml', '/crates/twip-capi/build-native.mjs']
