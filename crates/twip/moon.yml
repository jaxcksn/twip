$schema: '../../.moon/cache/schemas/project.json'
language: rust
tags: [engine]

# Native cargo runs through build-native.mjs, as the native library builds.
tasks:
  # The tests and the lint build it too.
  build:
    command: node ../twip-capi/build-native.mjs build -p twip
    inputs: ['src/**/*', 'build.rs', 'Cargo.toml', '/crates/twip-capi/build-native.mjs']
    options:
      runInCI: false
  # The unit tests and the rust contract runner (tests/contract.rs).
  test:
    command: node ../twip-capi/build-native.mjs test -p twip
    inputs: ['src/**/*', 'build.rs', 'tests/**/*', 'examples/**/*', 'Cargo.toml', '/tests/contract/**/*', '/crates/twip-capi/build-native.mjs']
  example:
    command: node ../twip-capi/build-native.mjs run -p twip --example session
    inputs: ['src/**/*', 'examples/**/*', 'Cargo.toml', '/crates/twip-capi/build-native.mjs']
