[package]
name = "twip-wasm"
description = "The WebAssembly module (wasm32-unknown-unknown, with wasm-bindgen) the TypeScript SDK loads."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# The module: the C ABI's functions as its exports.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
twip-capi = { path = "../twip-capi" }
