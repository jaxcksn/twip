$schema: '../../.moon/cache/schemas/project.json'
language: rust
tags: [engine]

tasks:
  # Needs emsdk's emcc on PATH (CI: setup-emsdk; locally: emsdk_env). Downloads the prebuilt browser Skia once.
  build:
    command: node build-web.mjs
    inputs: ['src/**/*', 'build.rs', 'build-web.mjs', 'Cargo.toml', 'twip-host.js', '/crates/twip-capi/src/**/*', '/crates/twip/src/**/*', '/crates/twip/cpp/**/*', '/crates/twip/build.rs']
    outputs: ['/target/wasm32-unknown-emscripten/release/twip-wasm.js', '/target/wasm32-unknown-emscripten/release/twip_wasm.wasm']
  # The layout snapshot check (crates/twip/src/layout/tests/output.rs) built for the web and run under Node, against
  # the same snapshots twip:test compares on Windows and Linux.
  test:
    command: node build-web.mjs test
    inputs: ['build-web.mjs', '/crates/twip/src/**/*', '/crates/twip/cpp/**/*', '/crates/twip/build.rs', '/crates/twip/Cargo.toml', '/crates/twip/tests/fixtures/**/*', '/crates/twip/tests/layout/**/*']
