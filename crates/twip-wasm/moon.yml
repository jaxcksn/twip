$schema: '../../.moon/cache/schemas/project.json'
language: rust
tags: [engine]

tasks:
  # The module for wasm32-unknown-unknown and its wasm-bindgen glue, into target/twip-wasm. Needs the wasm-bindgen CLI
  # at twip-capi's wasm-bindgen version (build-web.mjs).
  build:
    command: node build-web.mjs
    inputs: ['src/**/*', 'build.rs', 'build-web.mjs', 'Cargo.toml', '/crates/twip-capi/src/**/*', '/crates/twip-capi/Cargo.toml', '/crates/twip/src/**/*', '/crates/twip/build.rs']
    outputs: ['/target/twip-wasm/twip-wasm.js', '/target/twip-wasm/twip_wasm.wasm']
  # The layout snapshot check (crates/twip/src/layout/tests/output.rs) built for WebAssembly (wasm32-wasip1) and run
  # under Node's WASI, against the same snapshots twip:test compares on Windows and Linux.
  test:
    command: node build-web.mjs test
    inputs: ['build-web.mjs', 'wasi-test.mjs', '/crates/twip/src/**/*', '/crates/twip/build.rs', '/crates/twip/Cargo.toml', '/crates/twip/tests/fixtures/**/*', '/crates/twip/tests/layout/**/*']
