[package]
name = "twip-wire"
description = "Twip's JSON wire: concrete encoders and decoders for the API types, derived."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Published with Twip at exactly its version (release-please keeps the pin in step).
twip-wire-derive = { path = "../twip-wire-derive", version = "=0.2.0" } # x-release-please-version
# Number formatting, byte for byte what serde_json writes.
itoa = "1.0.18"
ryu = "1.0.23"

[features]
# `schema::Describe` for every derived type, and the schema it builds: for tests and the SDK generators.
schema = []
