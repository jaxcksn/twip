$schema: '../../.moon/cache/schemas/project.json'
language: rust
tags: [engine]

tasks:
  # The SDKs are generated from src/lib.rs; never edit the output by hand.
  generate-dotnet:
    command: node generate.mjs dotnet ../../bindings/dotnet/generated
    inputs: ['src/**/*', 'diplomat.toml', 'generate.mjs']
    outputs: ['/bindings/dotnet/generated/**/*']
  generate-js:
    command: node generate.mjs js ../../bindings/web/generated
    inputs: ['src/**/*', 'diplomat.toml', 'generate.mjs']
    outputs: ['/bindings/web/generated/**/*']
