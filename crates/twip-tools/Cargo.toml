[package]
name = "twip-tools"
description = "Developer tools for the engine: golden comparisons, dumps, round trips, renders."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Built only when asked for (`cargo run -p twip-tools`): no tests, so `cargo test` never links a second Skia binary.
[[bin]]
name = "twip-tools"
path = "src/main.rs"
test = false
doctest = false

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
roxmltree = "0.21.1"
twip = { path = "../twip" }
serde_json = "1.0.154"
# The renderer replacing Skia, for the oracle's side-by-side comparison (cli/oracle.rs).
twip-graphics = { path = "../twip-graphics" }

# The engine's Skia features (crates/twip/Cargo.toml), so the two share one Skia.
[target.'cfg(not(any(target_os = "emscripten", target_os = "macos")))'.dependencies]
skia-safe = { version = "0.153.3", features = ["graphite", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { version = "0.153.3", features = ["graphite", "metal"] }

# As the engine's: the golden comparison indexes pages and rows of two layouts in step.
[lints.clippy]
needless_range_loop = "allow"
