$schema: '../../.moon/cache/schemas/project.json'
language: rust
tags: [engine]

tasks:
  # A protected PDF with keywords opened by qpdf and poppler (pdf-readers.sh). Linux only: CI installs both there.
  pdf-readers:
    command: sh crates/twip-tools/pdf-readers.sh
    inputs: ['/crates/twip/src/pdf/**/*', '/crates/twip-tools/src/cli/pdf.rs', '/crates/twip-tools/pdf-readers.sh']
    options:
      runFromWorkspaceRoot: true
      os: linux
  # The corpus's top-level fixtures and the accessible fixture exported and validated with veraPDF's PDF/UA-1 profile
  # (verapdf.sh, which fetches the pinned release). Linux only: CI runs it beside pdf-readers.
  pdf-ua:
    command: sh crates/twip-tools/verapdf.sh
    inputs:
      ['/crates/twip/src/pdf/**/*', '/crates/twip-graphics/src/pdf.rs', '/crates/twip-tools/src/cli/pdf.rs', '/crates/twip-tools/verapdf.sh', '/crates/twip-tools/verapdf-known.txt', '/crates/twip/tests/fixtures/*.docx', '/crates/twip/tests/fixtures/render/pdf-accessible.docx']
    options:
      runFromWorkspaceRoot: true
      os: linux
