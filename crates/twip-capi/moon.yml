$schema: '../../.moon/cache/schemas/project.json'
language: rust
tags: [engine]

tasks:
  # The native library the .NET SDK loads: target/release/twip.dll, libtwip.so or libtwip.dylib.
  build:
    command: node build-native.mjs
    inputs: ['src/**/*', 'include/**/*', 'Cargo.toml', 'build-native.mjs', '/crates/twip/src/**/*', '/crates/twip/cpp/**/*', '/crates/twip/build.rs']
  test:
    command: node build-native.mjs test -p twip-capi
    inputs: ['src/**/*', 'tests/**/*', 'include/**/*', 'Cargo.toml', '/crates/twip/src/**/*']
