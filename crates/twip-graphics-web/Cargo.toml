[package]
name = "twip-graphics-web"
description = "twip-graphics' cross-backend comparisons in a browser, on its WebGPU (bindings/web/graphics)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# A WebAssembly module for wasm-bindgen; empty on other targets.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
twip-graphics = { path = "../twip-graphics", features = ["gpu"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
# The JavaScript boundary; exactly the version of the wasm-bindgen CLI that makes the glue.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
# The scenes' text and colour glyphs (as twip-graphics' tests have them).
skrifa = "~0.49"
font-test-data = "0.10"
# An image the scenes encode.
png = "0.18.1"
