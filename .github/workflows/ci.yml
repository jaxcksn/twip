name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # Squash merges use the PR title as the commit message, so it gets the same commitlint rules as local commits.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # moon compares with the base branch
      - uses: moonrepo/setup-toolchain@v0
      - run: moon setup
      - run: pnpm install --frozen-lockfile
      - name: Conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

  deny:
    # Dependency licenses, advisories and sources (.cargo/deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Every check is a moon task; moon ci runs those the change affects (and the tasks that depend on them). The shards
  # are .moon/ci-plan.json's jobs: the rust tests, the native library and .NET, and the web SDK and docs. Locally:
  # `moon ci` on a branch, or `moon ci --force` for everything.
  moon:
    name: moon (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2]
    runs-on: ${{ matrix.os }}
    env:
      # The runners' GPU is software: its WebGPU paints blank, and its frames are too slow for a refresh. WebGPU and GPU
      # frame times are tested on a machine with a GPU.
      TWIP_SOFTWARE_GPU: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # moon compares with the base revision
          filter: 'blob:none'
      - uses: moonrepo/setup-toolchain@v0
      - run: moon setup
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            .web-deps
            .native-deps
      # Skia links FreeType and Fontconfig; and metric-compatible stand-ins for the fonts documents use (Calibri,
      # Cambria, Arial, Times New Roman, Courier New).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev libfontconfig1-dev fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: '6.0.8'
          actions-cache-folder: emsdk-cache
      # A run by hand checks every task.
      - run: moon ci --plan .moon/ci-plan.json --job ${{ matrix.shard }} ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          matrix: ${{ toJSON(matrix) }}
