name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, every task, which also refreshes the Rust caches (see rust-cache below).
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every check is a moon task; moon ci runs those the change affects (and the tasks that depend on them). The shards
  # are .moon/ci-plan.json's jobs: the rust tests, the native library and .NET, and the web SDK and docs. Locally:
  # `moon ci` on a branch, or `moon ci --force` for everything.
  tasks:
    name: 'Tasks: ${{ matrix.shard.name }} (${{ matrix.os }})'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # .moon/ci-plan.json's jobs, in its order.
        shard:
          - { job: 0, name: Engine }
          - { job: 1, name: .NET }
          - { job: 2, name: Web and docs }
        # The npm package and docs are built on Linux; the Windows wasm build is checked locally.
        exclude:
          - os: windows-latest
            shard: { job: 2, name: Web and docs }
    runs-on: ${{ matrix.os }}
    env:
      # The runners' GPU is software: its WebGPU paints blank, and its frames are too slow for a refresh. WebGPU and GPU
      # frame times are tested on a machine with a GPU.
      TWIP_SOFTWARE_GPU: '1'
      # The release builds the .NET and web tests load skip the shipped profile's whole-program LTO and single codegen
      # unit, which make them the slowest builds here; build.yml builds the packages with the shipped profile.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      # Runs by hand and the weekly run check every task.
      FULL: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # moon compares with the base revision
          filter: 'blob:none'
      - uses: moonrepo/setup-toolchain@v0
      - run: moon setup
      - run: pnpm install --frozen-lockfile
      # One cache per shard: each builds different dependencies (debug tests, clippy and release, wasm). Only full
      # runs save it; a run moon trims to a few tasks would save a near-empty cache that sticks until Cargo.lock changes.
      - uses: Swatinem/rust-cache@v2
        with:
          key: shard-${{ matrix.shard.job }}
          save-if: ${{ env.FULL == 'true' }}
          cache-directories: |
            .web-deps
      # Metric-compatible stand-ins for the fonts documents use (Calibri, Cambria, Arial, Times New Roman, Courier
      # New); and qpdf and poppler, which open protected PDFs as readers do.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation qpdf poppler-utils
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: '6.0.8'
          actions-cache-folder: emsdk-cache
      - run: moon ci --plan .moon/ci-plan.json --job ${{ matrix.shard.job }} ${{ env.FULL == 'true' && '--force' || '' }}
      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          matrix: ${{ toJSON(matrix) }}
      # The layout snapshot check draws the pages it found changed: open index.html in the artifact. The web shard
      # runs it in the WebAssembly module (twip-wasm:test).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: layout-diff-${{ matrix.shard.job == 2 && 'wasm' || matrix.os }}
          path: target/layout-diff
          if-no-files-found: ignore
