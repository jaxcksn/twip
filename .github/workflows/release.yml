# release-please keeps a release PR open on main for the next stable version.
# Merging it tags the release; the jobs below then publish what was released. Run by hand with a tag, they re-publish
# it. Canaries are canary.yml. Only this workflow publishes to crates.io, nuget.org and npm (trusted publishing names
# this file and the release environment); build.yml builds the packages it publishes.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to re-publish (v0.1.0)
        required: true
      publish:
        description: Registries to publish to (any of crate nuget npm)
        default: crate nuget npm

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      engine: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v5
        with:
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
      # The pull requests labelled layout-change since the last release, under "Layout changes" in the open release
      # PR's changelog entry. Rewritten on every run: release-please rebuilds the entry when it updates the PR.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - name: Layout changes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName // ""')
          [ -n "$branch" ] || exit 0
          # The last release, from main's manifest (the release PR's names the next one).
          tag=v$(jq -r '."."' .github/.release-please-manifest.json)
          git fetch --depth 1 origin "$branch" && git checkout -B "$branch" FETCH_HEAD
          since=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .commit.committer.date)
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --label layout-change --search "merged:>$since" \
            --limit 500 --json number,title,url > "$RUNNER_TEMP/layout.json"
          python3 - "$RUNNER_TEMP/layout.json" <<'EOF'
          import json, re, sys
          # As release-please words an entry: the type dropped, the scope in bold.
          def entry(pr):
              m = re.match(r'[a-z]+(?:\((.*?)\))?!?: (.*)', pr['title'])
              title = (f'**{m[1]}:** ' if m[1] else '') + m[2] if m else pr['title']
              return f"* {title} ([#{pr['number']}]({pr['url']}))"
          items = '\n'.join(entry(pr) for pr in sorted(json.load(open(sys.argv[1])), key=lambda pr: pr['number']))
          text = open('CHANGELOG.md', newline='').read()
          head = re.search(r'^## .*\n+', text, re.M)
          end = re.search(r'^## ', text[head.end():], re.M)
          end = head.end() + end.start() if end else len(text)
          body = re.sub(r'### Layout changes\n.*?(?=^### |\Z)', '', text[head.end():end], flags=re.M | re.S)
          section = f'### Layout changes\n\n{items}\n\n\n' if items else ''
          open('CHANGELOG.md', 'w', newline='').write(text[:head.end()] + section + body + text[end:])
          EOF
          git diff --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qam 'chore(release): list layout changes'
          git push origin "HEAD:$branch"

  crate:
    needs: release-please
    if: needs.release-please.outputs.engine == 'true' || contains(inputs.publish, 'crate')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      # Skia links FreeType and Fontconfig (publish builds the package to verify it).
      - run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev libfontconfig1-dev
      # Trusted publishing (OIDC): a short-lived token for this run.
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish -p twip
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.engine == 'true' || inputs.tag
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag }}
      nuget: ${{ needs.release-please.outputs.engine == 'true' || contains(inputs.publish, 'nuget') }}
      npm: ${{ needs.release-please.outputs.engine == 'true' || contains(inputs.publish, 'npm') }}

  nuget:
    needs: [release-please, build]
    if: needs.release-please.outputs.engine == 'true' || contains(inputs.publish, 'nuget')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.nuget.org/packages/Twip.Core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
      # Trusted publishing (OIDC): a key valid for an hour, so it's requested just before the push.
      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }} # the nuget.org profile name, not an email
      - run: dotnet nuget push '*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  npm:
    needs: [release-please, build]
    if: needs.release-please.outputs.engine == 'true' || contains(inputs.publish, 'npm')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@twip/web
    permissions:
      contents: read
      id-token: write
    steps:
      # The toolchain, for the pinned pnpm.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: moonrepo/setup-toolchain@v0
      - run: moon setup
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: ${{ runner.temp }}/npm
      # Trusted publishing (OIDC); the dist-tag follows the version (0.1.0-alpha.2 -> alpha). npm only accepts
      # provenance from public repositories. Published from the unpacked tarball, as it was published from bindings/web.
      - name: Publish
        env:
          PROVENANCE: ${{ !github.event.repository.private && '--provenance' || '' }}
        # node and pnpm run from the checkout, where proto finds their versions.
        run: |
          tar xzf "$RUNNER_TEMP"/npm/*.tgz -C "$RUNNER_TEMP/npm"
          pkg=$RUNNER_TEMP/npm/package
          version=$(node -p "require('$pkg/package.json').version")
          tag=$(echo "$version" | sed -nE 's/^[0-9.]+-([a-z]+).*/\1/p'); tag=${tag:-latest}
          pnpm publish "$pkg" --access public $PROVENANCE --no-git-checks --tag "$tag"
