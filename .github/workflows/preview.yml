# A pull request labeled preview gets @twip/web published to pkg.pr.new on every push, and a comment with the install
# command. Nothing reaches npm. Needs the pkg.pr.new GitHub App on the repository. NuGet previews are nuget-preview.yml.
name: Preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions: {}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      canary: true
      npm: true

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: ${{ runner.temp }}/npm
      - run: |
          cd "$RUNNER_TEMP/npm" && tar xzf ./*.tgz
          npx --yes pkg-pr-new publish ./package
