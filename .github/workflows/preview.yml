# A pull request labeled preview gets @twip/web published to pkg.pr.new on every push, and a comment with the install
# command. Nothing reaches npm. Needs the pkg.pr.new GitHub App on the repository. NuGet previews are nuget-preview.yml.
# One job, so the PR's checks list one line for it.
name: Preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions: {}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # moon compares with the base branch
      - uses: ./.github/actions/build-web
        with:
          canary: true
      - run: npx --yes pkg-pr-new publish ./bindings/web
