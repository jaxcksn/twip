# SonarQube Cloud analysis of the Rust crates. The web and .NET SDKs are separate Sonar projects with their own
# workflows; this one reads only .rs files, so the C++ shims, JS glue and bindings stay out of it.
name: Sonar (Rust)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonar-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      TWIP_SOFTWARE_GPU: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar blames lines to find new code
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev libfontconfig1-dev fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The engine and C API tests, the same ones the Engine shard runs, instrumented for line coverage.
      - run: rustup component add llvm-tools-preview && cargo llvm-cov -p twip -p twip-capi --lcov --output-path lcov.info
      # The scanner runs clippy itself on the workspace (Cargo.toml at the root) with the quality profile's rules.
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=jaxcksn
            -Dsonar.projectKey=twip
            -Dsonar.sources=crates
            -Dsonar.inclusions=**/*.rs
            -Dsonar.exclusions=**/tests/fixtures/**
            -Dsonar.rust.lcov.reportPaths=lcov.info
