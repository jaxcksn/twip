# SonarQube Cloud analysis of the Rust crates. The web and .NET SDKs are separate Sonar projects with their own
# workflows; this one reads only .rs files, so the C++ shims, JS glue and bindings stay out of it.
name: Sonar (Rust)

# Rust changes only; a docs or SDK change has nothing here to analyze.
on:
  pull_request:
    paths: [crates/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/sonar-rust.yml]
  push:
    branches: [main]
    paths: [crates/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/sonar-rust.yml]
  workflow_dispatch:

concurrency:
  group: sonar-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      TWIP_SOFTWARE_GPU: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar blames lines to find new code
      # Saved from main only, where every pull request can restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libfreetype6-dev libfontconfig1-dev fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The engine and C API tests, the same ones the Engine shard runs, instrumented for line coverage.
      # Without the six corpus and random-edit tests that run over a minute each: they replay code the other tests
      # already cover, and the Engine shard still runs them.
      - run: >
          rustup component add llvm-tools-preview &&
          cargo llvm-cov -p twip -p twip-capi --lcov --output-path lcov.info --
          --skip random_edits::
          --skip every_change_in_the_corpus_is_a_recorded_transaction
          --skip scenarios::scenarios
          --skip retained_pages_record_once_and_again_only_where_layout_changed
          --skip editing_state_is_the_same_with_any_renderer_or_none
      # The scanner runs clippy itself on the workspace (Cargo.toml at the root) with the quality profile's rules.
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=jaxcksn
            -Dsonar.projectKey=twip
            -Dsonar.sources=crates
            -Dsonar.inclusions=**/*.rs
            -Dsonar.exclusions=**/tests/fixtures/**
            -Dsonar.rust.lcov.reportPaths=lcov.info
