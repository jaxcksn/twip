# CodSpeed: the benchmarks of crates/twip/benches and crates/twip-graphics/benches that aren't marked
# `ignore = cfg!(codspeed_build)`, measured by CPU simulation (instruction and cache counts, which don't drift on a shared
# runner): measurements off a developer's machine, not a pull request gate. Each Rust change on main is measured; any
# other branch by hand (Actions, CodSpeed, Run workflow). Locally: `cargo codspeed build -p twip -p twip-graphics`, then
# `cargo codspeed run` runs each once.
name: CodSpeed

# Rust changes on main only, as the Sonar workflow.
on:
  push:
    branches: [main]
    paths: [crates/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/codspeed.yml]
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # CodSpeed's OpenID Connect sign-in; the repository is public, so it needs no token
    steps:
      - uses: actions/checkout@v7
      # Saved from main only, where every pull request can restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          key: codspeed
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # At the version of the codspeed-divan-compat the benchmarks build with.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed@6.1.0
      - run: cargo codspeed build -p twip -p twip-graphics
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run
