# Builds and tests @twip/web in bindings/web/dist, after a checkout with fetch-depth: 0 (moon compares with the base
# branch). Shared by build.yml's npm job and preview.yml.
name: Build @twip/web
description: Builds and tests the npm package

inputs:
  canary:
    description: Version it 0.0.0-canary-<short SHA> (stamp-canary.sh)
    default: 'false'

runs:
  using: composite
  steps:
    - uses: moonrepo/setup-toolchain@v0
    - run: moon setup
      shell: bash
    - run: pnpm install --frozen-lockfile
      shell: bash
    # The WebAssembly module's glue (crates/twip-wasm build-web.mjs), at twip-capi's wasm-bindgen version.
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen@0.2.129
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-about
    - run: node licenses/notices.mjs THIRD-PARTY-NOTICES.md
      shell: bash
    - if: inputs.canary == 'true'
      run: sh .github/stamp-canary.sh
      shell: bash
    - run: moon run web:test
      shell: bash
    # The package is dist/: the module, its types, the engine and the worker entry.
    - run: test -f dist/index.js && test -f dist/index.d.ts && test -f dist/worker.js
      shell: bash
      working-directory: bindings/web
